name: Verify source and Docker runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image from the committed deployment files
        run: docker build -t shiyin:test .
      - name: Check the webpage, CSS and API in the production container
        run: |
          docker run -d --name shiyin-test -p 127.0.0.1:18080:3000 shiyin:test
          curl -fsS --max-time 5 --retry 20 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18080/ -o /tmp/shiyin-home.html
          docker exec shiyin-test node --input-type=module -e '
            const base="http://127.0.0.1:3000";
            const page=await (await fetch(base)).text();
            if(!page.includes("拾音"))throw Error("Missing application page");
            const href=page.match(/href="([^\"]+\.css(?:\?[^\"]*)?)"/)?.[1];
            if(!href)throw Error("Missing stylesheet");
            const css=await fetch(new URL(href,base));
            if(!css.ok||!(await css.text()).length)throw Error("Stylesheet not served");
            const scan=await fetch(base+"/api/scan",{
              method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({url:"http://127.0.0.1/private"})
            });
            const result=await scan.json();
            if(scan.status!==400||!result.error)throw Error("Private URL validation failed");
            const transfer=await fetch(base+"/api/transfers",{
              method:"POST",headers:{"Content-Type":"application/json"},
              body:JSON.stringify({kind:"file",title:"Runtime status check",totalFiles:1})
            });
            const task=await transfer.json();
            if(transfer.status!==201||task.state!=="waiting"||!task.id)throw Error("Download task creation failed");
            const query=new URLSearchParams({url:"http://127.0.0.1/private",transferId:task.id});
            const rejected=await fetch(base+"/api/download?"+query);
            if(rejected.status!==400)throw Error("Private download validation failed");
            await rejected.json();
            const statusResponse=await fetch(base+"/api/transfers?id="+encodeURIComponent(task.id));
            const status=await statusResponse.json();
            if(!statusResponse.ok||status.state!=="failed"||!status.error)throw Error("Download failure status was not shared between routes");
            console.log("Production page, stylesheet, API and download status verified");
          '
      - name: Typecheck and compile the exported source on Linux
        run: |
          docker run --rm -v "$PWD:/src" -w /src node:22-bookworm \
            sh -c 'npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run package:runtime'
      - name: Show runtime logs
        if: always()
        run: docker logs shiyin-test || true
      - name: Remove the test container
        if: always()
        run: docker rm -f shiyin-test || true
